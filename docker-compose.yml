name: keypage

services:
  keypage:
    image: keypage
    build: .
    container_name: keypage
    ports:
      # Fallback matches DEFAULT_LISTEN_PORT in packages/shared/src/app.ts
      - "${PORT:-9090}:${PORT:-9090}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
