# KeyPage CI (SAA-213)
# Runs alongside .github/workflows/sonarqube.yml — do not replace that scan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  docker-smoke:
    name: docker compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
      - name: Prepare .env from example
        run: cp .env.example .env
      - name: Build and start stack
        env:
          DOCKER_BUILDKIT: "0"
          COMPOSE_DOCKER_CLI_BUILD: "0"
          COMPOSE_BAKE: "false"
        run: docker compose up -d --build
      - name: Assert health and setup UI
        run: bash scripts/ci-docker-smoke.sh
      - name: Compose status on failure
        if: failure()
        run: |
          # Do not dump `docker compose logs` on failure (avoid shipping runtime secrets).
          docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down
