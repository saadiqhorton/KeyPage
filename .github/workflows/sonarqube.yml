name: SonarQube
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install
      - name: Run tests with native Node coverage
        run: bash scripts/run-sonar-coverage.sh
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.dezignerdrugz.com
        with:
          args: >
            -Dsonar.projectKey=saadiqhorton_KeyPage_4f8f9925-b8a2-4b18-abb3-66e3ba36a503
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=apps,packages
            -Dsonar.tests=apps,packages
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.ws.timeout=120
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
