name: SonarQube
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install
      - name: Run tests with native Node coverage
        continue-on-error: true
        run: |
          mkdir -p coverage
          (cd apps/api && node --import tsx --test --experimental-test-coverage --test-reporter=lcov "src/**/*.test.ts" > ../../coverage/api.lcov || true)
          (cd apps/web && node --import tsx --test --experimental-test-coverage --test-reporter=lcov "src/**/*.test.{ts,tsx}" > ../../coverage/web.lcov || true)
          (cd packages/shared && node --import tsx --test --experimental-test-coverage --test-reporter=lcov "src/**/*.test.ts" > ../../coverage/shared.lcov || true)
          node scripts/merge-sonar-lcov.mjs --out coverage/lcov.info \
            apps/api:coverage/api.lcov \
            apps/web:coverage/web.lcov \
            packages/shared:coverage/shared.lcov
          echo "SF paths in merged lcov:"
          grep -c '^SF:' coverage/lcov.info || true
          grep '^SF:' coverage/lcov.info | head -20 || true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://177.7.36.102:9000
        with:
          args: >
            -Dsonar.projectKey=saadiqhorton_KeyPage_4f8f9925-b8a2-4b18-abb3-66e3ba36a503
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=apps,packages
            -Dsonar.tests=apps,packages
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
