name: SonarQube
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install
      - name: Run tests with native Node coverage
        run: bash scripts/run-sonar-coverage.sh
      - name: SonarQube Scan
        id: sonar-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.dezignerdrugz.com
        with:
          args: >
            -Dsonar.projectKey=saadiqhorton_KeyPage_4f8f9925-b8a2-4b18-abb3-66e3ba36a503
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=apps,packages
            -Dsonar.tests=apps,packages
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.ws.timeout=120
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Report failed quality-gate conditions
        if: steps.sonar-scan.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.dezignerdrugz.com
        run: |
          task_url=$(sed -n 's/^ceTaskUrl=//p' .scannerwork/report-task.txt)
          analysis_id=""
          for _ in $(seq 1 30); do
            task_json=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$task_url")
            analysis_id=$(jq -r '.task.analysisId // empty' <<< "$task_json")
            [[ -z "$analysis_id" ]] || break
            sleep 2
          done
          [[ -n "$analysis_id" ]]
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysis_id}" \
            | jq '{status: .projectStatus.status, failedConditions: [.projectStatus.conditions[] | select(.status == "ERROR") | {metricKey, comparator, errorThreshold, actualValue}]}'
          exit 1
